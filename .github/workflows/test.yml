name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Mise tools
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run tests, including native encoder tests
        run: mise run test

      - name: Test native launcher selection and failures
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          node --test scripts/native-launcher.test.mjs scripts/package-main.test.mjs scripts/native-notices.test.mjs

      - name: Smoke test native executable
        shell: bash
        run: |
          binary=./dist/native/caido-dev
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --help
          "$binary" --version
