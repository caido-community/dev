name: Validate

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_ENV: dev

    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Mise tools
        uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          working_directory: .
          version: ${{ vars.CI__MISE_VERSION }}
          install_args: --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: mise run format:prod

      - name: Lint
        run: mise run lint:prod

      - name: Typecheck
        run: mise run typecheck:prod

      - name: Knip
        run: mise run knip:prod

      - name: Audit GitHub Actions workflows
        run: mise run zizmor
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Audit Rust dependencies
        run: mise run audit:prod
