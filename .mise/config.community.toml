# Opt-in integration tools: mise --env community install --locked
[tools]
node = '24'
# Keep the primary first; pnpm 10 is used only for a failed install retry.
pnpm = ['11.18.0', '10.20.0']
'aqua:jqlang/jq' = '1.8.1'
# Aqua supports the upstream Intel macOS binary through Rosetta on Apple Silicon.
'aqua:ouch-org/ouch' = '0.6.1'
