[package]
name = "caido-dev"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
comrak = { version = "=0.41.0", default-features = false }
html5ever = "=0.38.0"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
clap = { version = "=4.5.48", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
sanitize-filename = "=0.6.0"
typed-path = "=0.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
base64 = "=0.22.1"
data-url = "=0.3.2"
fluent-uri = "=0.3.2"
zip = { version = "=9.0.5", default-features = false }
webp = { version = "=0.3.1", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
notify = "=8.2.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
